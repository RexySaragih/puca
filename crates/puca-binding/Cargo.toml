[package]
name = "puca-binding"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "napi-rs bindings exposing puca-core to Node"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", default-features = false, features = ["napi4"] }
napi-derive = "2"
puca-core = { path = "../puca-core" }

[build-dependencies]
napi-build = "2"
