[package]
name = "puca-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rust mutator engine: parse, discover sites, apply mutations"

[lib]
name = "puca_core"
path = "src/lib.rs"

[dependencies]
oxc_allocator = "0.158.0"
oxc_ast = "0.158.0"
oxc_ast_visit = "0.158.0"
oxc_parser = "0.158.0"
oxc_span = "0.158.0"
oxc_syntax = "0.158.0"

[dev-dependencies]
criterion = "0.5.1"

[[bench]]
name = "discover"
harness = false
